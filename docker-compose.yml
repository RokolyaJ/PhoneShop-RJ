services:
  phoneshop:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: phoneshop
      POSTGRES_USER: phoneshop
      POSTGRES_PASSWORD: phoneshop

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
